name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - name: Dependências Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            xvfb \
            dbus-x11
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  bundle:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - name: Dependências Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            xvfb \
            dbus-x11
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build
      - name: Smoke test em perfil limpo
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
          LIBGL_DRI3_DISABLE: "1"
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          GDK_BACKEND: x11
          RUST_BACKTRACE: "1"
          RUST_LOG: "info"
        run: scripts/clean-machine-smoke.sh src-tauri/target/release/orbit-launcher
      - name: Validar AppImage
        run: |
          APPIMAGE="$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -print -quit)"
          if [[ -z "$APPIMAGE" ]]; then
            echo "::error::Nenhum AppImage foi gerado"
            exit 1
          fi
          scripts/validate-appimage.sh "$APPIMAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-linux-bundles
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

  arch-package:
    needs: test
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm git rust pnpm nodejs webkit2gtk-4.1 libayatana-appindicator librsvg openssl curl libsecret
      - uses: actions/checkout@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && cargo build --release --locked --manifest-path src-tauri/Cargo.toml
